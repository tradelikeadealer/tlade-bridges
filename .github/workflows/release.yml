name: Build & Release Bridges

# Trigger on every push to main + manual run from Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build per-bridge zips + all-in-one fallback
        run: |
          set -e
          mkdir -p pkg
          # Copy each bridge into a self-explanatory folder name so users see
          # a clean "TLADe-X-Bridge/" after extracting (no nested path).
          cp -r bridges/ib            pkg/TLADe-IB-Bridge
          cp -r bridges/rithmic       pkg/TLADe-Rithmic-Bridge
          # NT8 is assembled from a NAMED LIST for the same reason ATAS is, below.
          # Copying the folder shipped bridges/ninjatrader/original/, whose
          # TLAdeBridge.cs and tlade_bridge_nt8.py have the SAME FILENAMES as the
          # live ones - a user who extracted and copied the wrong one got the
          # as-delivered contributor build, and on 14 October that build still
          # carried the bug that published every instrument as ES. It also shipped
          # the GEX Levels indicator and a zip of it, which are their own download
          # (TLADeGexDashboardNT.zip) and have nothing to do with the local feed.
          # set -e is on, so a renamed file fails the build instead of quietly
          # shipping a bundle with a hole in it. (14 October 2026)
          N=pkg/TLADe-NT8-Bridge
          mkdir -p "$N"
          cp bridges/ninjatrader/README.md           "$N/"
          cp bridges/ninjatrader/UPDATING.md         "$N/"
          cp bridges/ninjatrader/TLAdeBridge.cs      "$N/"
          cp bridges/ninjatrader/tlade_bridge_nt8.py "$N/"
          # ATAS is assembled from a NAMED LIST, not copied wholesale. Copying the
          # folder is what shipped the real DLL buried three levels down under
          # bin/Release/net10.0-windows, a second DLL with the identical filename
          # under mac/bin/Release, the as-delivered contributor sources in original/,
          # a zip inside the zip, and no instructions at all - INSTALL.txt was never
          # a tracked file, so it never reached anyone. Users copied the Mac file, or
          # a pre-3.5.0 source, and the indicator silently showed nothing. One of them
          # spent two days on it before writing to us. The release notes above already
          # promise "no nested directories, no irrelevant files"; for ATAS that was
          # not true until now. set -e is on, so a renamed or missing file fails the
          # build loudly instead of quietly shipping a bundle with a hole in it.
          # (14 October 2026)
          A=pkg/TLADe-ATAS-Bundle
          # No mac/ folder in here. It carried a .dll with the IDENTICAL filename to the
          # Windows one, three levels down, and people copied that one and got a chart
          # with nothing on it and no error to explain why. macOS has its own download,
          # TLADe-ATASX.zip, whose DLL has a different name and its own install folder.
          # The INSTALL.txt in this bundle says so.
          mkdir -p "$A/python-bridge" "$A/source"
          cp bridges/atas/INSTALL.txt                                     "$A/"
          cp bridges/atas/README.md                                       "$A/"
          cp bridges/atas/bin/Release/net10.0-windows/TLAdeBridgeATAS.dll "$A/"
          cp bridges/atas/start.bat                                       "$A/python-bridge/"
          cp "bridges/atas/TLADe Autostart.bat"                           "$A/python-bridge/"
          cp bridges/atas/tlade_bridge_atas.py                            "$A/python-bridge/"
          cp bridges/atas/tlade_auto_fetch.py                             "$A/python-bridge/"
          cp bridges/atas/tlade_push_levels.py                            "$A/python-bridge/"
          cp bridges/atas/TLAdeBridgeATAS.cs                              "$A/source/"
          cp bridges/atas/TLAdeGexDashboardATAS.cs                        "$A/source/"
          cp bridges/atas/TLAdeQuantumFieldLadder.cs                      "$A/source/"
          cp bridges/atas/TLAdeBridgeATAS.csproj                          "$A/source/"
          cd pkg
          zip -r ../TLADe-IB-Bridge.zip      TLADe-IB-Bridge
          zip -r ../TLADe-Rithmic-Bridge.zip TLADe-Rithmic-Bridge
          zip -r ../TLADe-NT8-Bridge.zip     TLADe-NT8-Bridge
          zip -r ../TLADe-ATAS-Bundle.zip    TLADe-ATAS-Bundle
          cd ..
          # ATAS X (Avalonia: Windows and macOS, one file) is its own download: the DLL
          # has a different name and goes into %APPDATA%\ATAS X\Indicators, not the
          # classic folder. Built from the committed artifact, like the MotiveWave jar —
          # it compiles against the assemblies of an ATAS install, which are not in this
          # repository, so the CI cannot produce it from source.
          #
          # It was NOT in this list and was uploaded by hand: it sat on the 2 September
          # build for six weeks, and from 12 October the Quantum Field Ladder inside it
          # was drawing nothing at all while nobody could see that the download was stale.
          # Third time this exact failure bit us — TLADeGexDashboardNT.zip in October, the
          # MotiveWave jar on the 13th, this one now. (14 October 2026)
          mkdir -p pkg-atasx/TLADe-ATASX
          cp bridges/atas/bin-atasx/Release/TLAdeBridgeATASX.dll pkg-atasx/TLADe-ATASX/
          cp bridges/atas/README_ATASX_EN.md                     pkg-atasx/TLADe-ATASX/README.md
          ( cd pkg-atasx && zip -r "$GITHUB_WORKSPACE/TLADe-ATASX.zip" TLADe-ATASX )
          # The NT8 indicator on its own, zipped from inside its folder so the
          # paths stay Indicators/... and Info.xml, which is what NinjaTrader's
          # importer expects.
          #
          # This is the asset the PRODUCT links to: the terminal's Indicators
          # page points straight at it (terminal/constants/indicatorCatalog.ts),
          # so it is the file every NinjaTrader subscriber downloads. It used to
          # be uploaded by hand, and went three weeks stale without anyone
          # noticing: the CI kept rebuilding TLADe-NT8-Bridge.zip, which nobody
          # downloads, while the one people actually get stayed on an old build.
          # A subscriber found it by reporting a bug that was already fixed.
          # (7 October 2026)
          ( cd bridges/ninjatrader/TLADeGexDashboardNT && zip -r "$GITHUB_WORKSPACE/TLADeGexDashboardNT.zip" Indicators Info.xml )
          # The Quantower indicator, zipped so it extracts to GammaExposure/ exactly
          # as the hand-uploaded asset did - the README and anything a user wrote
          # down still match. It was NOT in the files list and had been uploaded by
          # hand on 13 September: verified byte-identical to the repo today, so
          # nobody was running anything stale, but the NEXT change to it would not
          # have reached the release. Fifth asset with this exact exposure, after
          # TLADeGexDashboardNT.zip, the MotiveWave jar, ATASX and the NT8 bundle.
          # (14 October 2026)
          mkdir -p pkg-qt/GammaExposure
          cp bridges/quantower/GammaExposure.cs  pkg-qt/GammaExposure/
          cp bridges/quantower/GammaExposure.dll pkg-qt/GammaExposure/
          cp bridges/quantower/README.md         pkg-qt/GammaExposure/
          ( cd pkg-qt && zip -r "$GITHUB_WORKSPACE/GammaExposure-Quantower.zip" GammaExposure )
          # The MotiveWave jar is a BUILT artifact committed in the repo, and the
          # Indicators page links it straight off this release. It was not in the
          # files list below, so a push refreshed NT8 and ATAS and left MotiveWave
          # on whatever jar had last been uploaded by hand: on 13 October the
          # release carried a 35898-byte jar while the repo held the 36149-byte
          # 3.5.2 build with the SPY ratio fix. Same failure that left
          # TLADeGexDashboardNT.zip three weeks stale in October. Carried here so
          # the download URL never has to change and never goes stale again.
          cp bridges/motivawe/dist/TLADeGexDashboard.jar "$GITHUB_WORKSPACE/TLADeGexDashboard.jar"
          # Sierra Chart (28 October 2026): two studies, two downloads, each from a NAMED LIST like
          # every other asset here. The DLLs are built by Sierra's Remote Build on a licensed
          # installation and committed, as the ATAS DLLs are: the CI cannot compile ACSIL.
          mkdir -p pkg-sc/TLADe-SierraChart pkg-sc-alex/TLADe-SierraChart-QuantumLadder-Alex
          cp bridges/sierra/README.md                 pkg-sc/TLADe-SierraChart/
          cp bridges/sierra/TLADe_GEX_Dashboard.cpp   pkg-sc/TLADe-SierraChart/
          cp bridges/sierra/TLADe_GEX_Dashboard_64.dll pkg-sc/TLADe-SierraChart/
          ( cd pkg-sc && zip -r "$GITHUB_WORKSPACE/TLADe-SierraChart.zip" TLADe-SierraChart )
          cp bridges/sierra/alex/README.md                        pkg-sc-alex/TLADe-SierraChart-QuantumLadder-Alex/
          cp bridges/sierra/alex/TLADe_quantum_field_ladder.cpp    pkg-sc-alex/TLADe-SierraChart-QuantumLadder-Alex/
          cp bridges/sierra/alex/TLADe_quantum_field_ladder_64.dll pkg-sc-alex/TLADe-SierraChart-QuantumLadder-Alex/
          ( cd pkg-sc-alex && zip -r "$GITHUB_WORKSPACE/TLADe-SierraChart-QuantumLadder-Alex.zip" TLADe-SierraChart-QuantumLadder-Alex )
          # All-in-one bundle (for legacy bookmarks pointing to the previous
          # main.zip pattern, and for users who want every bridge at once).
          mkdir -p pkg-all/TLADe-AllBridges
          cp -r bridges     pkg-all/TLADe-AllBridges/
          # No exclusion list any more, and that is the point. Until 14 October
          # 2026 this wholesale copy had to be followed by a hand-maintained list
          # of folders to delete - superseded builds, `original/` contributor
          # copies, the ATAS `mac/` tree - because the repository held files with
          # the SAME FILENAMES as the live ones. A customer who extracted the
          # bundle and copied one of those got a chart with nothing on it and no
          # error to explain why: two days, for one subscriber, on a duplicate
          # name. The list had already fallen behind twice.
          #
          # Those copies now live outside the repository, so every file under
          # bridges/ is current by construction. What replaces the list is a guard
          # in the OTHER direction: if a folder of superseded copies ever comes
          # back, this build STOPS instead of shipping it. A list you must
          # remember to extend is not a safeguard; a build that refuses is.
          STALE=$(find bridges -type d \( -name '_archive_*' -o -name original -o -name mac -o -name '*_20[0-9][0-9][0-9][0-9][0-9][0-9]' \) -print)
          STALE="$STALE$(find bridges -type f \( -name '*([0-9])*' -o -name 'TLADe-ATAS-Bundle.zip' -o -name 'TLADeGexDashboardNT.zip' \) -print)"
          if [ -n "$STALE" ]; then
            echo "ERROR: superseded or duplicate-named copies are back in the repository:"
            echo "$STALE"
            echo "They must not reach a download. Keep them outside the repo - see CHANGELOG, 14 October 2026."
            exit 1
          fi
          cp -r protocol    pkg-all/TLADe-AllBridges/
          cp -r templates   pkg-all/TLADe-AllBridges/
          cp README.md      pkg-all/TLADe-AllBridges/
          cp LICENSE        pkg-all/TLADe-AllBridges/
          cd pkg-all
          zip -r ../TLADe-AllBridges.zip TLADe-AllBridges
          cd ..
          ls -la *.zip

      # The release notes are the download table plus CHANGELOG.md, so the page
      # people land on says what changed and what is open, instead of only
      # listing files. The changelog is the source; this just carries it.
      - name: Compose release notes
        run: |
          cat > RELEASE_BODY.md <<'HEADER'
          Per-bridge installer bundles, auto-built on every commit to `main`.

          Each zip extracts into a single self-contained folder — no nested
          directories, no irrelevant files, and no second copy of a file under
          the same name.

          The IB and Rithmic bridges start from `start.bat` (Windows) or
          `start.command` (macOS) at the top of the folder. NinjaTrader and ATAS
          do not use one: open the `README.md` in the folder, which says exactly
          what to run and in which order.

          | Bridge | Download |
          |---|---|
          | Interactive Brokers | `TLADe-IB-Bridge.zip` |
          | Rithmic (Apex / TopstepTrader / Bulenox / 12+ prop firms) | `TLADe-Rithmic-Bridge.zip` |
          | NinjaTrader 8 | `TLADe-NT8-Bridge.zip` |
          | ATAS Platform (full bundle: bridge + GEX Dashboard + Quantum Field Ladder) | `TLADe-ATAS-Bundle.zip` |
          | All bridges (full bundle, fallback) | `TLADe-AllBridges.zip` |
          | NinjaTrader 8 indicator only (what the terminal links to) | `TLADeGexDashboardNT.zip` |
          | MotiveWave study (one jar: macOS, Windows, Linux) | `TLADeGexDashboard.jar` |
          | Quantower indicator | `GammaExposure-Quantower.zip` |
          | Sierra Chart study, beta (TLADe GEX Dashboard) | `TLADe-SierraChart.zip` |
          | Sierra Chart, Quantum Field Ladder by Alex (community) | `TLADe-SierraChart-QuantumLadder-Alex.zip` |

          Source: `bridges/<feed>/` in the repo. Pick the feed you use,
          download the matching zip, "Extract All", run `start.bat`.

          ---

          HEADER
          cat CHANGELOG.md >> RELEASE_BODY.md

      # Every zip built above must ALSO be named in `files` below: on 28/10/2026 the two Sierra
      # Chart zips were built and not published because this list did not have them. No comments
      # inside `files`: it is a block of text, each line is read as a file pattern.
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Bridges
          body_path: RELEASE_BODY.md
          files: |
            TLADe-IB-Bridge.zip
            TLADe-Rithmic-Bridge.zip
            TLADe-NT8-Bridge.zip
            TLADeGexDashboardNT.zip
            TLADe-ATAS-Bundle.zip
            TLADe-ATASX.zip
            TLADe-AllBridges.zip
            TLADeGexDashboard.jar
            GammaExposure-Quantower.zip
            TLADe-SierraChart.zip
            TLADe-SierraChart-QuantumLadder-Alex.zip
          make_latest: true
          fail_on_unmatched_files: true
